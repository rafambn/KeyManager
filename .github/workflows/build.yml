name: Build and Test

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew :composeApp:jvmTest --no-daemon
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: composeApp/build/test-results/jvmTest/
          retention-days: 7

  build-distributions:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageReleaseMsi
            name: Windows x64
            artifact-name: keymanager-windows-x64
            artifact-path: composeApp/build/compose/binaries/main-release/msi/*.msi

          - os: macos-15-intel
            task: packageReleaseDmg
            name: macOS x64
            artifact-name: keymanager-macos-x64
            artifact-path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

          - os: macos-latest
            task: packageReleaseDmg
            name: macOS ARM64
            artifact-name: keymanager-macos-arm64
            artifact-path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

          - os: ubuntu-latest
            task: packageReleaseDeb
            name: Linux x64
            artifact-name: keymanager-linux-x64
            artifact-path: composeApp/build/compose/binaries/main-release/deb/*.deb

          - os: ubuntu-24.04-arm
            task: packageReleaseDeb
            name: Linux ARM64
            artifact-name: keymanager-linux-arm64
            artifact-path: composeApp/build/compose/binaries/main-release/deb/*.deb

          - os: ubuntu-24.04-arm
            task: packageDeb
            name: Linux ARM64
            artifact-name: keymanager-linux-arm64
            artifact-path: composeApp/build/compose/binaries/main/deb/*.deb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build distribution
        run: ./gradlew :composeApp:${{ matrix.task }} --no-daemon
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7
